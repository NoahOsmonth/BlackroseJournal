<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blackrose — Variant B · Anchored Popover</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet" />
<link rel="stylesheet" href="assets/sheet.css" />
<style>
  /* ==========================================================================
     VARIANT B — Anchored Popover
     --------------------------------------------------------------------------
     Different remedy: change the container, not the dismissal. A bottom sheet
     claims the whole lower screen and therefore owns a large dead band. A
     popover anchored to the `...` button claims only what it needs, so there is
     almost no "inside" to get stuck in — and the scrim underneath is a clean,
     unobstructed tap target by construction.
     The scrim is also much lighter: at 0.2 the card stays legible, which is
     what you want when the menu is about *that card*. No Cancel row — the
     anchor is visibly a transient layer, and outside is everywhere.
     ========================================================================== */

  .scrim[data-open='true'] { opacity: 1; }

  .popover .action {
    min-height: 44px;
    font-size: 0.9375rem;
  }
  .popover .action.danger {
    margin-top: 0.375rem;
    border-top: 1px solid var(--hairline);
    border-radius: 0 0 var(--radius-control) var(--radius-control);
    padding-top: 0.75rem;
  }

  /* A little tail, so the popover reads as attached to the `...` it came from. */
  .popover::after {
    content: '';
    position: absolute;
    top: -6px;
    right: 22px;
    width: 11px;
    height: 11px;
    background: var(--surface);
    border-left: 1px solid var(--hairline);
    border-top: 1px solid var(--hairline);
    transform: rotate(45deg);
  }
</style>
</head>
<body>
<div class="phone">
  <div class="scrim" id="scrim" data-open="false" style="background: rgba(0,0,0,0.2)"></div>
  <div class="popover" id="popover" data-open="false" role="menu" aria-label="More options"></div>
</div>

<script src="assets/parts.js"></script>
<script>
(function () {
  BR.boot(function (host) {
    var scrim = document.getElementById('scrim');
    var pop = document.getElementById('popover');
    var trigger = document.getElementById('trigger');

    pop.innerHTML = BR.ACTIONS.map(function (a) { return BR.actionRow(a); }).join('');

    var open = false;

    function place() {
      /* Anchored to the trigger's real measured box — never to a hardcoded
         offset, which is what put the previous menu under the wrong element. */
      var t = trigger.getBoundingClientRect();
      var p = host.getBoundingClientRect();
      pop.style.top = (t.bottom - p.top + 10) + 'px';
      pop.style.right = (p.right - t.right - 8) + 'px';
    }

    function setOpen(next) {
      open = next;
      if (open) place();
      pop.dataset.open = String(open);
      scrim.dataset.open = String(open);
      trigger.setAttribute('aria-expanded', String(open));
    }

    trigger.addEventListener('click', function (e) {
      e.stopPropagation();
      setOpen(!open);
    });

    /* Outside is one uninterrupted surface: the popover is the only thing above
       it, so a tap anywhere else dismisses. */
    scrim.addEventListener('click', function () { setOpen(false); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && open) setOpen(false);
    });

    pop.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-action]');
      if (btn) setOpen(false);
    });

    window.addEventListener('resize', function () { if (open) place(); });
  });
})();
</script>
</body>
</html>
