name: Android release

# Builds a signed APK and attaches it to the GitHub Release for the version.
# Trigger it by pushing a tag (git tag v0.1.0 && git push origin v0.1.0) or by
# running this workflow by hand from the Actions tab.
#
# Speed: a full build compiles the native code for every ABI, which is what made
# the first runs slow. This builds arm64-v8a only (every phone from the last
# several years) and keeps the Gradle cache between runs, so a rebuild is minutes
# instead of twenty.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, as X.Y.Z. Defaults to the newest v* tag.'
        required: false
        default: ''
      architectures:
        description: 'Which ABIs to build. arm64-v8a fits every modern phone; all is the old universal APK.'
        required: false
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - all

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Both the signing step and Gradle read these, so they belong to the job:
    # an env block on one step is not visible to the next.
    env:
      ANDROID_KEYSTORE_PATH: /tmp/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          fi
          if [ -z "${VERSION:-}" ]; then
            echo "::error::No version given and no v* tag exists yet. Re-run with a version such as 0.1.0."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not X.Y.Z."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          REF=""
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            REF="v$VERSION"
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "code=$CODE"
            echo "ref=$REF"
          } >> "$GITHUB_OUTPUT"
          echo "Building $VERSION with versionCode $CODE (source: ${REF:-current branch})"

      # The APK must be built from the released commit, not from whatever the
      # branch happens to be when the workflow is started by hand.
      - name: Check out the tagged commit
        if: steps.v.outputs.ref != ''
        run: git checkout --force "${{ steps.v.outputs.ref }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Without this every run recompiles every dependency from scratch; with it a
      # rebuild only compiles what actually changed.
      - name: Restore the Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Stamp the version into app.json
        env:
          VERSION: ${{ steps.v.outputs.version }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          node -e "
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.version = process.env.VERSION;
          app.expo.android = { ...(app.expo.android || {}), versionCode: Number(process.env.VERSION_CODE) };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log('app.json now', app.expo.version, app.expo.android.versionCode);
          "

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Point release builds at the CI keystore
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          # Inline rather than a repo script: an older tag does not contain one.
          cat > /tmp/sign.js <<'JS'
          const fs = require('fs');
          const file = 'android/app/build.gradle';
          let source = fs.readFileSync(file, 'utf8');
          if (source.includes('signingConfigs.release')) {
            console.log('android-signing: already patched');
            process.exit(0);
          }
          const anchor = 'signingConfigs {';
          const at = source.indexOf(anchor);
          if (at < 0) { console.error('android-signing: no signingConfigs block'); process.exit(1); }
          const block = [
            anchor,
            '        release {',
            '            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))',
            '            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")',
            '            keyAlias System.getenv("ANDROID_KEY_ALIAS")',
            '            keyPassword System.getenv("ANDROID_KEY_PASSWORD")',
            '        }',
          ].join('\n');
          source = source.slice(0, at) + block + source.slice(at + anchor.length);
          const debugSigning = 'signingConfig signingConfigs.debug';
          const last = source.lastIndexOf(debugSigning);
          if (last < 0) { console.error('android-signing: no release signingConfig line'); process.exit(1); }
          source = source.slice(0, last) + 'signingConfig signingConfigs.release' + source.slice(last + debugSigning.length);
          fs.writeFileSync(file, source);
          console.log('android-signing: release now signs with the CI keystore');
          JS
          node /tmp/sign.js
          grep -c "signingConfigs.release" android/app/build.gradle

      - name: Tune the Gradle build
        env:
          ARCHITECTURES: ${{ inputs.architectures || 'arm64-v8a' }}
        run: |
          set -euo pipefail
          {
            echo "org.gradle.caching=true"
            echo "org.gradle.parallel=true"
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          } >> android/gradle.properties
          if [ "$ARCHITECTURES" != "all" ]; then
            echo "reactNativeArchitectures=$ARCHITECTURES" >> android/gradle.properties
          fi
          echo "Building ABIs: $ARCHITECTURES"
          grep -E "reactNativeArchitectures|org.gradle.caching" android/gradle.properties

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --build-cache --console=plain --stacktrace

      - name: Name and check the APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::No APK at $APK"; exit 1; }
          NAME="blackrosejournal-${{ steps.v.outputs.version }}.apk"
          cp "$APK" "$NAME"
          ls -lh "$NAME"
          # keytool only reads v1 signatures, and release APKs are v2-signed, so
          # ask apksigner (shipped with the runner's Android SDK) who signed it.
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$NAME" | grep "certificate DN"
            if "$APKSIGNER" verify --print-certs "$NAME" | grep -qi "CN=Android Debug"; then
              echo "::error::APK is signed with the debug key"
              exit 1
            fi
          else
            echo "::warning::apksigner not found, skipping the signature check"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Collect release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          if [ -f CHANGELOG.md ] && grep -qE "^## +\[?v?${VERSION}\]?" CHANGELOG.md; then
            awk -v v="$VERSION" '
              $0 ~ "^## +\\[?v?" v "\\]?" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then
            printf 'APK build for v%s.\n' "$VERSION" > notes.md
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "${{ github.sha }}"
          gh release upload "$TAG" "$NAME" --clobber
          gh release view "$TAG" --json url --jq .url

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.v.outputs.version }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30
