name: Android release

# Builds a signed APK and attaches it to the GitHub Release for the version.
# Trigger it by pushing a tag (git tag v0.1.0 && git push origin v0.1.0) or by
# running this workflow by hand from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, as X.Y.Z. Defaults to the newest v* tag.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Both the signing step and Gradle read these, so they belong to the job:
    # an env block on one step is not visible to the next.
    env:
      ANDROID_KEYSTORE_PATH: /tmp/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          fi
          if [ -z "${VERSION:-}" ]; then
            echo "::error::No version given and no v* tag exists yet. Re-run with a version such as 0.1.0."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not X.Y.Z."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "code=$CODE"
          } >> "$GITHUB_OUTPUT"
          echo "Building $VERSION with versionCode $CODE"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Stamp the version into app.json
        env:
          VERSION: ${{ steps.v.outputs.version }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          node -e "
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.version = process.env.VERSION;
          app.expo.android = { ...(app.expo.android || {}), versionCode: Number(process.env.VERSION_CODE) };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log('app.json now', app.expo.version, app.expo.android.versionCode);
          "

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Sign release builds with the CI keystore
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          node scripts/android-signing.js
          grep -n "signingConfigs.release" android/app/build.gradle
          grep -n "signingConfig signingConfigs.release" android/app/build.gradle

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name and check the APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::No APK at $APK"; exit 1; }
          NAME="blackrosejournal-${{ steps.v.outputs.version }}.apk"
          cp "$APK" "$NAME"
          ls -lh "$NAME"
          echo "Signer:"
          keytool -printcert -jarfile "$NAME" | grep -E "Owner|Issuer" || true
          if keytool -printcert -jarfile "$NAME" | grep -qi "androiddebugkey"; then
            echo "::error::APK is signed with the debug key"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Collect release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          if [ -f CHANGELOG.md ] && grep -qE "^## +\[?v?${VERSION}\]?" CHANGELOG.md; then
            awk -v v="$VERSION" '
              $0 ~ "^## +\\[?v?" v "\\]?" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then
            printf 'APK build for v%s.\n' "$VERSION" > notes.md
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "${{ github.sha }}"
          gh release upload "$TAG" "$NAME" --clobber
          gh release view "$TAG" --json url --jq .url

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.v.outputs.version }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30
